# beatlight: a playback device that plays to the sound card exactly like
# plughw:CARD=PCH,DEV=0 and also copies the audio to the beatlight server as it's
# written. Install it as /etc/asound.conf (or ~/.asoundrc) where the player runs, then
# point the player at "beatlight". The default device is untouched, so pointing the
# player back at the card (or removing this file) restores the original setup.
#
# The copy is fixed at S32_LE / 44.1 kHz / stereo (the plug converts on the way in),
# so the server always knows the format. Replace hw:CARD=PCH,DEV=0 with your card
# (aplay -L lists them). For several players, add one device per player, each with
# its own one-letter source.

pcm_type.beatlight {
    lib "/opt/beatlight/libasound_module_pcm_beatlight.so"
}

pcm.beatlight {
    type plug
    slave {
        pcm { type beatlight; slave.pcm "hw:CARD=PCH,DEV=0"; source "s" }
        format S32_LE
        rate 44100
        channels 2
    }
}
